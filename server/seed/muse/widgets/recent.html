<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../pages/apollo.css">
<style>
html, body { height: 100%; background: transparent; }
body { margin: 0; padding: 14px 16px; max-width: none; border-radius: 24px; background: var(--raised); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
.t { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head><body data-tap="open">
<div class="kicker" style="margin:0">Muse</div>
<div><div class="t" id="t">Nothing played yet</div><div class="small" id="a"></div></div>
<div class="small"><span class="n" id="m" style="font-size:20px;color:var(--ink)">0</span> min today</div>
<script>
(function () {
  function q(s) { var r = window.apollo ? apollo.sql(s) : []; return Array.isArray(r) ? r : []; }
  var l = q("SELECT track, artist FROM plays ORDER BY at DESC LIMIT 1")[0];
  if (l) { document.getElementById("t").textContent = l.track || "Unknown track"; document.getElementById("a").textContent = l.artist || ""; }
  var d = new Date(); d.setHours(0, 0, 0, 0);
  var s = q("SELECT COALESCE(SUM(seconds), 0) AS s FROM plays WHERE at >= " + d.getTime())[0];
  document.getElementById("m").textContent = Math.round((s ? s.s : 0) / 60);
})();
</script></body></html>
