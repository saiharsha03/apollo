<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plazmi</title><link rel="stylesheet" href="apollo.css">
<style>
.post { font-size: 17px; line-height: 1.5; white-space: pre-wrap; margin: 6px 0 8px; }
.item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border: 0; }
.item .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }
</style></head><body>
<div class="kicker" style="margin-top:0">Plazmi</div>
<h1>Pan</h1><div class="small" id="status">No word from Pan yet.</div>
<div id="usage"></div>
<div id="card"></div>
<div class="tabs" id="tabs"></div>
<div class="card" id="list"></div>
<script>
(function () {
  // Pan's words are untrusted: every string goes in as textContent, nothing becomes a link or HTML.
  function q(s) { var r = window.apollo ? apollo.sql(s) : []; return Array.isArray(r) ? r : []; }
  function el(tag, cls, text, parent) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
  function when(ms) { return new Date(ms).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  var KINDS = [["", "All"], ["diary", "Diary"], ["postcard", "Postcards"], ["reply", "Replies"], ["event", "Events"], ["status", "Status"]];
  var kind = "";

  var st = q("SELECT ts, text, place, used, token_limit FROM feed WHERE kind = 'status' ORDER BY ts DESC LIMIT 1")[0];
  if (st) document.getElementById("status").textContent = st.text + (st.place ? " (" + st.place + ")" : "") + ", " + when(st.ts);
  var u = q("SELECT used, token_limit FROM feed WHERE kind = 'status' AND used IS NOT NULL AND token_limit > 0 ORDER BY ts DESC LIMIT 1")[0];
  if (u) {
    var box = el("div", "card", null, document.getElementById("usage")); box.style.marginTop = "12px";
    var line = el("div", "small", "Tokens today: " + u.used.toLocaleString("en-US") + " of " + u.token_limit.toLocaleString("en-US"), box);
    var bar = el("div", "bar" + (u.used >= u.token_limit ? " over" : ""), null, box); bar.style.marginTop = "8px";
    el("i", null, null, bar).style.width = Math.min(100, u.used / u.token_limit * 100) + "%";
  }
  var pc = q("SELECT ts, text, place FROM feed WHERE kind = 'postcard' ORDER BY ts DESC LIMIT 1")[0];
  if (pc) {
    el("div", "kicker", "Latest postcard", document.getElementById("card"));
    var c = el("div", "card", null, document.getElementById("card"));
    el("div", "post", pc.text, c);
    el("div", "small", (pc.place ? pc.place + ", " : "") + when(pc.ts), c);
  }

  function list() {
    var tabs = document.getElementById("tabs"); tabs.textContent = "";
    KINDS.forEach(function (k) {
      var b = el("button", null, k[1], tabs); b.setAttribute("aria-pressed", String(kind === k[0]));
      b.onclick = function () { kind = k[0]; list(); };
    });
    var rows = q("SELECT ts, kind, text, place FROM feed" + (kind ? " WHERE kind = '" + kind + "'" : "") + " ORDER BY ts DESC LIMIT 200");
    var box = document.getElementById("list"); box.textContent = "";
    if (!rows.length) { el("div", "empty", "Nothing here yet.", box); return; }
    rows.forEach(function (r) {
      var it = el("div", "item", null, box);
      el("div", "small", r.kind.charAt(0).toUpperCase() + r.kind.slice(1) + ", " + when(r.ts) + (r.place ? ", " + r.place : ""), it);
      el("div", "text", r.text, it);
    });
  }
  list();
})();
</script></body></html>
