<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../pages/look.css">
<script src="../pages/kit.js"></script>
<style>
html, body { height: 100%; background: transparent; }
body { margin: 0; padding: 14px 16px; border-radius: 24px; background: var(--raised); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.k { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--quiet); }
.l { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.l b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l span { color: var(--quiet); white-space: nowrap; }
.l span.need { color: var(--alarm); }
</style></head><body data-tap="open">
<div class="k">Birthdays</div>
<div id="b"><div class="quiet">No birthdays yet.</div></div>
<script>
(function () {
  var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  var rows = q("SELECT name, birthday FROM people WHERE birthday IS NOT NULL").map(function (p) {
    var m = String(p.birthday).match(/(\d{2})-(\d{2})$/); if (!m) return null;
    var d = new Date(t.getFullYear(), Number(m[1]) - 1, Number(m[2])); if (d < t) d.setFullYear(d.getFullYear() + 1);
    return { name: p.name, n: Math.round((d - t) / 86400000) };
  }).filter(Boolean).sort(function (a, b) { return a.n - b.n; }).slice(0, 3);
  if (rows.length) $("b").innerHTML = rows.map(function (r) {
    return '<div class="l"><b>' + esc(r.name) + '</b><span' + (r.n === 0 ? ' class="need"' : "") + ">" + (r.n === 0 ? "today" : r.n === 1 ? "tomorrow" : r.n + " days") + "</span></div>";
  }).join("");
})();
</script></body></html>
