<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../pages/apollo.css">
<style>
html, body { height: 100%; background: transparent; }
body { margin: 0; padding: 14px 16px; max-width: none; border-radius: 24px; background: var(--raised); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
</style></head><body data-tap="open">
<div class="kicker" style="margin:0">Spent this month</div>
<div class="n big" id="v">--</div>
<div class="small" id="s"></div>
<script>
(function () {
  function q(s) { var r = window.apollo ? apollo.sql(s) : []; return Array.isArray(r) ? r : []; }
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function sum(from, to) {
    var r = q("SELECT COALESCE(SUM(CASE WHEN kind = 'refund' THEN -amount ELSE amount END), 0) AS s FROM transactions WHERE kind IN ('spend', 'refund') AND not_counted = 0 AND date >= '" + from + "' AND date < '" + to + "'");
    return r.length ? r[0].s : 0;
  }
  var n = new Date(), a = sum(ymd(new Date(n.getFullYear(), n.getMonth(), 1)), ymd(new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1)));
  var b = sum(ymd(new Date(n.getFullYear(), n.getMonth() - 1, 1)), ymd(new Date(n.getFullYear(), n.getMonth() - 1, n.getDate() + 1)));
  document.getElementById("v").textContent = "$" + Math.round(a).toLocaleString("en-US");
  document.getElementById("s").textContent = b ? "$" + Math.round(b).toLocaleString("en-US") + " by this day last month" : "";
})();
</script></body></html>
