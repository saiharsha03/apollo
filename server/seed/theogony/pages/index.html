<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="look.css">
<script src="kit.js"></script>
<style>
  .q { padding: 16px; }
  .q h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.3; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 10px; }
  .chips button { min-height: 38px; padding: 0 14px; font-size: 14px; font-weight: 500; }
  .chips button.on { background: var(--ink); border-color: var(--ink); color: var(--ground); }
  .a { padding: 12px 0; border-top: 1px solid var(--line); }
  .a:first-child { border-top: 0; }
  .a b { display: block; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Questions</h1>
  <div class="tabs"><button data-t="open" class="on">For you</button><button data-t="done">Answered</button></div>
  <section id="open"></section>
  <section id="done" class="hidden"><div class="card" id="answers"></div></section>
</div>
<script>
(function () {
  var gone = {};

  function chips(r) { try { return JSON.parse(r.chips || "[]"); } catch (e) { return []; } }

  function open() {
    var rows = q("SELECT id, question, why, chips, multi FROM questions WHERE answer IS NULL AND skipped = 0 ORDER BY asked, id")
      .filter(function (r) { return !gone[r.id]; });
    $("open").innerHTML = rows.length ? rows.map(function (r) {
      return '<div class="card q" data-id="' + r.id + '" data-multi="' + (r.multi ? 1 : 0) + '"><h2>' + esc(r.question) + "</h2>" +
        (r.why ? '<div class="quiet">' + esc(r.why) + "</div>" : "") +
        '<div class="chips">' + chips(r).map(function (c) { return "<button>" + esc(c) + "</button>"; }).join("") + "</div>" +
        '<textarea rows="2" placeholder="Or in your words"></textarea>' +
        '<div class="bar"><button class="primary" data-save>Answer</button><button class="link" data-skip>Skip</button><span class="quiet"></span></div></div>';
    }).join("") : '<div class="empty">No questions right now. Athena adds them as she wonders.</div>';

    $("open").querySelectorAll(".q").forEach(function (card) {
      var id = Number(card.dataset.id), multi = card.dataset.multi === "1", text = card.querySelector("textarea");
      card.querySelectorAll(".chips button").forEach(function (b) {
        b.onclick = function () {
          if (!multi) card.querySelectorAll(".chips button").forEach(function (x) { if (x !== b) x.classList.remove("on"); });
          b.classList.toggle("on");
        };
      });
      function done(sql, params) {
        var r = write(sql, params);
        if (r.error) { card.querySelector(".bar .quiet").textContent = "Not saved: " + r.error; return; }
        gone[id] = true; open();
      }
      card.querySelector("[data-save]").onclick = function () {
        var picked = Array.prototype.map.call(card.querySelectorAll(".chips button.on"), function (b) { return b.textContent; });
        var words = text.value.trim(), answer = picked.concat(words ? [words] : []).join(", ");
        if (!answer) { text.focus(); return; }
        done("UPDATE questions SET answer = ?, answered_at = ? WHERE id = ?", [answer, Date.now(), id]);
      };
      card.querySelector("[data-skip]").onclick = function () { done("UPDATE questions SET skipped = 1 WHERE id = ?", [id]); };
    });
  }

  function answered() {
    var rows = q("SELECT question, answer, answered_at, filed FROM questions WHERE answer IS NOT NULL ORDER BY answered_at DESC");
    $("answers").innerHTML = rows.length ? rows.map(function (r) {
      return '<div class="a"><div class="quiet">' + esc(r.question) + "</div><b>" + esc(r.answer) + '</b><div class="quiet">' +
        day(r.answered_at) + (r.filed ? ", in Memory" : "") + "</div></div>";
    }).join("") : '<div class="empty">Nothing answered yet.</div>';
  }

  tabs(function (t) { if (t === "done") answered(); else open(); });
  open();
})();
</script>
</body>
</html>
