<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security</title><link rel="stylesheet" href="apollo.css">
<style>
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.chips button { background: none; border: 1px solid var(--line); color: var(--quiet); border-radius: 999px; padding: 6px 12px; font: inherit; }
.chips button.on { color: var(--ink); border-color: var(--ink); }
.ev { padding: 10px 0; border-bottom: 1px solid var(--line); }
.ev:last-child { border: 0; }
.ev .top { display: flex; justify-content: space-between; gap: 8px; }
.ev .text { overflow-wrap: anywhere; margin-top: 4px; }
</style></head><body>
<div class="kicker" style="margin-top:0">Security</div>
<h1>Server alerts</h1>
<div class="small quiet">Logins and blocked connections on the server. The same alerts go to Telegram.</div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<script>
(function () {
  function q(s) { var r = window.apollo ? apollo.sql(s) : []; return Array.isArray(r) ? r : []; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var KINDS = [["", "All"], ["security", "Logins"], ["plazmi", "Pan"], ["media", "Media"]], pick = "";
  function day(ms) { return new Date(ms).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "America/New_York" }); }
  function time(ms) { return new Date(ms).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }); }
  function draw() {
    document.getElementById("chips").innerHTML = KINDS.map(function (k) {
      return '<button data-k="' + k[0] + '" class="' + (k[0] === pick ? "on" : "") + '">' + k[1] + "</button>";
    }).join("");
    var known = KINDS.some(function (k) { return k[0] === pick; }) ? pick : "";     // only a chip's own value goes into the query
    var rows = q("SELECT * FROM events" + (known ? " WHERE source = '" + known + "'" : "") + " ORDER BY at DESC LIMIT 300");
    if (!rows.length) { document.getElementById("list").innerHTML = '<div class="card small quiet">No alerts yet. New ones show here within a minute.</div>'; return; }
    var out = "", last = "";
    rows.forEach(function (r) {
      var d = day(r.at);
      if (d !== last) { if (last) out += "</div>"; out += '<div class="kicker">' + esc(d) + '</div><div class="card">'; last = d; }
      out += '<div class="ev"><div class="top"><span class="small quiet">' + esc(r.source) + (r.origin === "root" ? "" : " · from " + esc(r.origin || "unknown")) + '</span><span class="small quiet">' + esc(time(r.at)) +
        '</span></div><div class="text">' + esc(r.text) + "</div></div>";
    });
    document.getElementById("list").innerHTML = out + "</div>";
  }
  document.getElementById("chips").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return; pick = b.getAttribute("data-k"); draw();
  });
  draw();
})();
</script>
</body></html>
