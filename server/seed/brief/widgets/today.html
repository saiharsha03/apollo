<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../pages/look.css">
<script src="../pages/kit.js"></script>
<style>
html, body { height: 100%; background: transparent; }
body { margin: 0; padding: 14px 16px; border-radius: 24px; background: var(--raised); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.k { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--quiet); }
.k.need { color: var(--alarm); }
.t { font-size: 24px; font-weight: 700; line-height: 1.15; }
.x { font-size: 14px; color: var(--quiet); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
</style></head><body data-tap="open">
<div class="k" id="k">Brief</div>
<div class="t" id="t">Not written yet</div>
<div class="x" id="x">Athena writes it before your first unlock after 5 AM.</div>
<script>
(function () {
  var date = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
  var b = q("SELECT md, cards FROM briefs WHERE date = " + lit(date))[0];
  if (!b) return;
  var cards = [];
  try { cards = JSON.parse(b.cards || "[]"); } catch (e) {}
  var c = cards.filter(function (x) { return x.need; })[0] || cards[0];
  if (c) {
    $("k").textContent = c.kicker || "Today";
    $("k").classList.toggle("need", !!c.need);
    $("t").textContent = c.title || "";
    $("x").textContent = c.text || "";
  } else {
    var first = String(b.md || "").split("\n").filter(function (l) { return l.trim() && !/^#/.test(l); })[0] || "";
    $("k").textContent = "Today"; $("t").textContent = "Your brief"; $("x").textContent = first.replace(/[*_`]/g, "");
  }
})();
</script></body></html>
