<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Apollo's tokens (apollo.css in the other seeds; this app's pages keep their own look, so they live here). */
@font-face { font-family: "Figtree"; src: url("../pages/fonts/figtree.ttf"); font-weight: 400 700; }
@font-face { font-family: "Doto"; src: url("../pages/fonts/doto.ttf"); font-weight: 700 900; }
:root { --raised: #171A1E; --ink: #ECEEF1; --quiet: #8B939C; --line: #262A30; color-scheme: dark; }
html, body { margin: 0; height: 100%; background: transparent; }
body { box-sizing: border-box; padding: 14px 16px; border-radius: 24px; background: var(--raised); border: 1px solid var(--line); color: var(--ink);
  font: 14px/1.3 "Figtree", system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.k { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--quiet); }
.t { font-family: "Doto", ui-monospace, monospace; font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.u { font: 600 18px "Figtree", system-ui, sans-serif; margin-left: 2px; }   /* Doto has no letters */
.s { color: var(--quiet); font-size: 13px; }
</style></head><body data-tap="open">
<div class="k" id="place">Weather</div><div class="t"><span id="temp">--</span><span class="u">°F</span></div><div class="s" id="sky">Open Weather once to fill this in.</div>
<script>
(function () {
  var SKY = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Cloudy",45:"Fog",48:"Fog",51:"Drizzle",53:"Drizzle",55:"Drizzle",61:"Rain",63:"Rain",65:"Heavy rain",
    66:"Freezing rain",67:"Freezing rain",71:"Snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
  // Open-Meteo answers in °C; he reads °F, as on the page.
  function f(c) { return Math.round(c * 9 / 5 + 32); }
  // The widget is drawn off screen from this app's origin, so it reads what the page cached.
  try {
    var d = JSON.parse(localStorage.getItem("aeolia.forecast") || "null"), s = JSON.parse(localStorage.getItem("aeolia.saved") || "null");
    if (d && d.current) {
      document.getElementById("temp").textContent = f(d.current.temperature_2m);
      var hl = d.daily ? ", " + f(d.daily.temperature_2m_max[0]) + "° high, " + f(d.daily.temperature_2m_min[0]) + "° low" : "";
      document.getElementById("sky").textContent = (SKY[d.current.weather_code] || "") + hl;
    }
    if (s && s.name) document.getElementById("place").textContent = s.name;
  } catch (e) {}
})();
</script></body></html>
